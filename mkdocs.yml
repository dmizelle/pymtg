site_name: PyMTG
site_description: "A unified Python library for Magic: The Gathering APIs."
site_url: https://pymtg.github.io/pymtg/
repo_url: https://github.com/pymtg/pymtg
repo_name: pymtg/pymtg
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - API Reference: reference.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [pymtg]
          options:
            show_source: false
            show_root_toc_entry: false
            show_category_heading: true
            show_subcategories: true
            group_by_category: true
            heading_level: 2
            members_order: alphabetical
            docstring_style: google
            docstring_options:
              ignore_init_summary: true
            filters: ["!^_"]
      default_handler: python

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/pymtg/pymtg

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.snippets:
      base_path: ["!$", docs_dir]
  - toc:
      permalink: true
