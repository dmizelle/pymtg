[project]
name = "pymtg"
version = "0.1.0"
description = "A Python library providing a unified interface to Magic: The Gathering APIs (Scryfall, Archidekt, Moxfield, etc.) with normalized data models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.28.0",
    "pydantic>=2.0",
    "typing-extensions>=4.0",
    "pytest>=9.1.1",
    "packaging>=26.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.0",
    
    "types-requests>=2.28.0",
    "pyright>=1.1.411",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.pyright]
pythonVersion = "3.11"



[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
