apiVersion: fission.sh/v1
kind: Spec
metadata:
  name: archidekt-provider
  title: Archidekt Provider API Specification
  description: |
    Specification for the Archidekt provider that interacts with Archidekt's REST API
    to provide Magic: The Gathering deck building functionality.
    
    API Base URL: https://archidekt.com/api/
    
    Authentication: JWT tokens obtained via /api/rest-auth/login/

spec:
  # Provider metadata
  provider:
    name: archidekt
    displayName: Archidekt
    description: Provider for interacting with Archidekt's MTG deck building platform
    version: 1.0.0
    author: dev-team
    license: MIT

  # API configuration
  api:
    baseUrl: https://archidekt.com/api/
    authentication:
      type: jwt
      endpoint: /api/rest-auth/login/
      tokenHeader: authorization
      tokenPrefix: "JWT "
      sessionCookie: true
    rateLimiting:
      enabled: true
      maxRequests: 60
      perWindow: 60
      windowSeconds: 60

  # Endpoints
  endpoints:
    # Authentication
    - name: login
      path: /api/rest-auth/login/
      method: POST
      description: |
        Authenticate user and obtain JWT tokens for API access.
        
        Example from HAR file shows:
        - Username: example_user
        - Password: example_password123
        - Response: JWT access_token and refresh_token
      request:
        headers:
          - name: Content-Type
            value: application/json
            required: true
        body:
          type: object
          required:
            - username
            - password
          properties:
            username:
              type: string
              description: User's username or email
              example: example_user
            password:
              type: string
              description: User's password
              example: example_password123
              sensitive: true
      response:
        success:
          statusCode: 200
          headers:
            - name: Content-Type
              value: application/json
          body:
            type: object
            properties:
              access_token:
                type: string
                description: JWT access token for API requests
                example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
              refresh_token:
                type: string
                description: JWT refresh token for obtaining new access tokens
                example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        error:
          statusCodes: [400, 401, 403]
          body:
            type: object
            properties:
              detail:
                type: string
                example: Invalid credentials

    # Deck Management
    - name: createDeck
      path: /api/decks/v2/
      method: POST
      description: |
        Create a new deck in Archidekt.
        
        From HAR analysis, a deck creation request includes:
        - name: Deck name
        - deckFormat: Format ID (3 = Commander)
        - game: Game ID (1 = MTG)
        - parent_folder: Folder ID
        - extras.commandersToAdd: List of commander card IDs
      authentication: required
      request:
        headers:
          - name: authorization
            value: JWT <access_token>
            required: true
          - name: Content-Type
            value: application/json
            required: true
        body:
          type: object
          required:
            - name
            - deckFormat
            - game
          properties:
            name:
              type: string
              description: Name of the deck
              maxLength: 100
              example: My Commander Deck
            deckFormat:
              type: integer
              description: Deck format ID (3 = Commander, 2 = Standard, etc.)
              example: 3
            edhBracket:
              type: integer
              description: EDH bracket ID (null for no bracket)
              nullable: true
              example: null
            description:
              type: string
              description: Deck description
              maxLength: 500
              nullable: true
              example: A competitive commander deck
            private:
              type: boolean
              description: Whether deck is private
              default: true
              example: true
            unlisted:
              type: boolean
              description: Whether deck is unlisted
              default: true
              example: true
            theorycrafted:
              type: boolean
              description: Whether deck is theorycrafted
              default: true
              example: true
            game:
              type: integer
              description: |
                Game ID (1 = Magic: The Gathering, 2 = Commander Legends, etc.)
              example: 1
            parent_folder:
              type: integer
              description: |
                Parent folder ID. Note: the Archidekt API uses snake_case for
                this field while other fields in the same request body use
                camelCase (e.g., deckFormat, edhBracket); the client preserves
                the API's native casing.
              example: 1735877
            extras:
              type: object
              description: Additional deck options
              properties:
                commandersToAdd:
                  type: array
                  items:
                    type: integer
                  description: List of card IDs for commanders
                  example: [109768]
                forceCardsToSingleton:
                  type: boolean
                  description: Force singleton rule
                  default: false
                  example: false
                ignoreCardsOutOfCommanderIdentity:
                  type: boolean
                  description: Ignore commander identity rules
                  default: true
                  example: true
      response:
        success:
          statusCode: 201
          headers:
            - name: Content-Type
              value: application/json
          body:
            type: object
            properties:
              id:
                type: integer
                description: Deck ID
                example: 24299438
              name:
                type: string
                description: Deck name
                example: testing123
              owner:
                type: object
                properties:
                  id:
                    type: integer
                    example: 1071357
                  username:
                    type: string
                    example: phobos_pymtg
                  avatar:
                    type: string
                    example: https://storage.googleapis.com/topdekt-user/avatars/default/avatar_colorless.svg
                  moderator:
                    type: boolean
                    example: false
                  roles:
                    type: array
                    items:
                      type: string
                    example: []
              deckFormat:
                type: integer
                example: 3
              edhBracket:
                type: integer
                nullable: true
                example: null
              colors:
                type: object
                description: Color identity counts
                example: {W: 0, U: 1, B: 0, R: 0, G: 0}
              updatedAt:
                type: string
                format: date-time
                example: 2026-07-12T18:27:09.269631Z
              createdAt:
                type: string
                format: date-time
                example: 2026-07-12T18:27:09.269631Z
        error:
          statusCodes: [400, 401, 403]
          body:
            type: object
            properties:
              detail:
                type: string
                example: Invalid deck format

    - name: getDeck
      path: /api/decks/{deck_id}/
      method: GET
      description: |
        Retrieve a deck by ID.
        
        Note: HAR shows frontend uses /_next/data/... URLs, but API endpoint
        is /api/decks/{deck_id}/
      authentication: required
      parameters:
        - name: deck_id
          type: integer
          in: path
          required: true
          description: ID of the deck to retrieve
          example: 24299438
      response:
        success:
          statusCode: 200
          headers:
            - name: Content-Type
              value: application/json
          body:
            type: object
            description: |
              Raw Archidekt API response. Field names use the API's native
              camelCase (e.g., deckFormat, updatedAt, createdAt). The client
              transforms these to snake_case (e.g., format_id, updated_at,
              created_at) when mapping into the Pydantic Deck model defined
              below.
            properties:
              id:
                type: integer
                example: 24299438
              name:
                type: string
                example: testing123
              description:
                type: string
                nullable: true
                example: null
              deckFormat:
                type: integer
                example: 3
              colors:
                type: object
                example: {W: 0, U: 1, B: 0, R: 0, G: 0}
              updatedAt:
                type: string
                format: date-time
                example: 2026-07-12T18:27:09.269631Z
              createdAt:
                type: string
                format: date-time
                example: 2026-07-12T18:27:09.269631Z
              cards:
                type: array
                items:
                  type: object
                description: Cards in the deck
        error:
          statusCodes: [401, 403, 404]
          body:
            type: object
            properties:
              detail:
                type: string
                example: Deck not found

    # Card Management
    - name: searchCards
      path: /api/cards/v2/
      method: GET
      description: |
        Search for cards in the Archidekt database.
        
        From HAR analysis, search requests include:
        - nameSearch: Partial name search (e.g., "Myra")
        - name: Exact name match (e.g., "Sol Ring")
        - exact: Exact match mode
        - oracleCardIds: Specific card IDs
        - Various filter parameters
        
        Multiple search requests in HAR show different query parameters
        for searching cards like "Myra", "sol ring", "arcane signet", etc.
      authentication: optional
      parameters:
        - name: nameSearch
          type: string
          in: query
          description: Partial name search
          example: Black Lotus
        - name: name
          type: string
          in: query
          description: Exact name match
          example: Sol Ring
        - name: exact
          type: boolean
          in: query
          description: Exact match mode
          example: false
        - name: oracleCardIds
          type: array
          items:
            type: integer
          in: query
          description: Specific card IDs to search
          example: [109768]
        - name: formatLegality
          type: integer
          in: query
          description: Format legality ID
          example: 3
        - name: game
          type: integer
          in: query
          description: Game ID (1 = MTG)
          example: 1
        - name: colors
          type: string
          in: query
          description: Comma-separated colors
          example: White,Blue,Black,Red,Green
        - name: colorIdentity
          type: boolean
          in: query
          description: Include color identity
          example: true
        - name: rarity
          type: string
          in: query
          description: Comma-separated rarities
          example: common,uncommon,rare,mythic
        - name: page
          type: integer
          in: query
          description: Page number
          example: 1
        - name: pageSize
          type: integer
          in: query
          description: Results per page
          default: 20
          example: 20
        - name: includeTokens
          type: boolean
          in: query
          description: Include tokens
          example: true
        - name: includeDigital
          type: boolean
          in: query
          description: Include digital cards
          example: true
        - name: includeEmblems
          type: boolean
          in: query
          description: Include emblems
          example: true
        - name: includeArtCards
          type: boolean
          in: query
          description: Include art cards
          example: true
        - name: unique
          type: boolean
          in: query
          description: Return unique cards only
          example: true
        - name: orderBy
          type: string
          in: query
          description: Sort order
          example: oracleCard__name
      response:
        success:
          statusCode: 200
          headers:
            - name: Content-Type
              value: application/json
          body:
            type: object
            properties:
              count:
                type: integer
                description: Total number of results
                example: 1
              next:
                type: string
                format: uri
                nullable: true
                description: Next page URL
                example: null
              previous:
                type: string
                format: uri
                nullable: true
                description: Previous page URL
                example: null
              results:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      description: Card printing ID
                      example: 152606
                    oracleCard:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 20089
                        name:
                          type: string
                          example: Sol Ring
                        manaCost:
                          type: string
                          nullable: true
                          example: {1}
                        typeLine:
                          type: string
                          example: Artifact
                        oracleText:
                          type: string
                          nullable: true
                          example: {T}, Sacrifice Sol Ring: Add {1}.
                        power:
                          type: string
                          nullable: true
                          example: null
                        toughness:
                          type: string
                          nullable: true
                          example: null
                        loyalty:
                          type: integer
                          nullable: true
                          example: null
                    collectorNumber:
                      type: string
                      example: "211"
                    editions:
                      type: array
                      items:
                        type: object
                      description: Printing information
        error:
          statusCodes: [400, 401, 403]
          body:
            type: object
            properties:
              detail:
                type: string
                example: Invalid search parameters

    # Card Modification
    - name: modifyCards
      path: /api/decks/{deck_id}/modifyCards/v2/
      method: PATCH
      description: |
        Add or remove cards from a deck.
        
        From HAR analysis, card modification uses PATCH /api/decks/{deck_id}/modifyCards/v2/
        with a request body containing action, cardId, and quantity.
      authentication: required
      parameters:
        - name: deck_id
          type: integer
          in: path
          required: true
          description: ID of the deck to modify
          example: 24299438
      request:
        headers:
          - name: authorization
            value: JWT <access_token>
            required: true
          - name: Content-Type
            value: application/json
            required: true
        body:
          type: object
          required:
            - action
            - cardId
          properties:
            action:
              type: string
              enum: [add, remove]
              description: Action to perform
              example: add
            cardId:
              type: integer
              description: Card printing ID to add/remove
              example: 152606
            quantity:
              type: integer
              description: Number of copies to add/remove
              default: 1
              minimum: 1
              maximum: 4
              example: 4
            foil:
              type: boolean
              description: Whether to add/remove foil version
              default: false
              example: false
      response:
        success:
          statusCode: 200
          headers:
            - name: Content-Type
              value: application/json
          body:
            type: object
            description: Updated deck information
            example: {id: 24299438, name: testing123, updatedAt: 2026-07-12T19:00:00Z}
        error:
          statusCodes: [400, 401, 403, 404]
          body:
            type: object
            properties:
              detail:
                type: string
                example: Card not found in deck

  # Data Models
  models:
    User:
      type: object
      description: |
        Authenticated user information
      properties:
        id:
          type: integer
          description: User ID
          example: 1071357
        username:
          type: string
          description: Username
          example: example_user
        email:
          type: string
          description: Email address
          nullable: true
          example: user@example.com
        is_active:
          type: boolean
          description: Whether account is active
          example: true
        avatar:
          type: string
          description: URL to user avatar
          nullable: true
          example: https://storage.googleapis.com/topdekt-user/avatars/default/avatar_colorless.svg
        moderator:
          type: boolean
          description: Whether user is a moderator
          example: false
        roles:
          type: array
          items:
            type: string
          description: User roles
          example: []

    AuthTokens:
      type: object
      description: |
        JWT authentication tokens
      properties:
        access_token:
          type: string
          description: JWT access token
        refresh_token:
          type: string
          description: JWT refresh token

    Deck:
      type: object
      description: |
        A Magic: The Gathering deck
      properties:
        id:
          type: integer
          description: Deck ID
          example: 24299438
        name:
          type: string
          description: Deck name
          example: My Commander Deck
        description:
          type: string
          description: Deck description
          nullable: true
          example: A competitive commander deck
        format:
          type: string
          description: Deck format name
          example: commander
        formatId:
          type: integer
          description: Deck format ID
          example: 3
        cards:
          type: array
          items:
            $ref: '#/models/DeckCard'
          description: Cards in the deck
        is_public:
          type: boolean
          description: Whether deck is publicly visible
          example: false
        created_at:
          type: string
          format: date-time
          description: When deck was created
          example: 2026-07-12T18:27:09.269631Z
        updated_at:
          type: string
          format: date-time
          description: When deck was last updated
          example: 2026-07-12T18:27:09.269631Z
        colors:
          type: object
          description: Color identity counts
          example: {W: 0, U: 1, B: 0, R: 0, G: 0}

    DeckCard:
      type: object
      description: |
        A card in a deck with quantity and printing information
      properties:
        id:
          type: integer
          description: Card printing ID
          example: 152606
        card_id:
          type: integer
          description: Oracle card ID
          example: 20089
        name:
          type: string
          description: Card name
          example: Sol Ring
        mana_cost:
          type: string
          description: Mana cost
          nullable: true
          example: {1}
        type_line:
          type: string
          description: Card type line
          example: Artifact
        oracle_text:
          type: string
          description: Oracle text
          nullable: true
          example: {T}, Sacrifice Sol Ring: Add {1}.
        quantity:
          type: integer
          description: Number of copies in deck
          example: 4
        printing_id:
          type: integer
          description: Specific printing ID
          example: 152606
        foil:
          type: boolean
          description: Whether this is a foil printing
          example: false
        collector_number:
          type: string
          description: Collector number
          example: "211"
        set_code:
          type: string
          description: Set code
          example: MID
        set_name:
          type: string
          description: Set name
          example: March of the Machine

    Card:
      type: object
      description: |
        A Magic: The Gathering card
      properties:
        id:
          type: integer
          description: Oracle card ID
          example: 20089
        name:
          type: string
          description: Card name
          example: Sol Ring
        mana_cost:
          type: string
          description: Mana cost
          nullable: true
          example: {1}
        type_line:
          type: string
          description: Card type line
          example: Artifact Creature — Construct
        oracle_text:
          type: string
          description: Oracle text
          nullable: true
          example: {T}: Add {1}.
        power:
          type: string
          description: Power value (for creatures)
          nullable: true
          example: "0"
        toughness:
          type: string
          description: Toughness value (for creatures)
          nullable: true
          example: "1"
        loyalty:
          type: integer
          description: Loyalty value (for planeswalkers)
          nullable: true
          example: null
        cmc:
          type: number
          description: Converted mana cost
          nullable: true
          example: 1
        colors:
          type: array
          items:
            type: string
            enum: [W, U, B, R, G]
          description: Colors in mana cost
          example: [W]
        color_identity:
          type: array
          items:
            type: string
            enum: [W, U, B, R, G]
          description: Color identity
          example: [W]
        prints:
          type: array
          items:
            $ref: '#/models/CardPrinting'
          description: Available printings

    CardPrinting:
      type: object
      description: |
        A specific printing/edition of a card
      properties:
        id:
          type: integer
          description: Printing ID
          example: 152606
        name:
          type: string
          description: Card name
          example: Sol Ring
        set_code:
          type: string
          description: Set code
          example: MID
        set_name:
          type: string
          description: Set name
          example: March of the Machine
        collector_number:
          type: string
          description: Collector number
          example: "211"
        rarity:
          type: string
          description: Rarity
          enum: [common, uncommon, rare, mythic, special]
          example: common
        image_small:
          type: string
          description: URL to small card image
          nullable: true
          example: https://cards.scryfall.io/small/front/1/2/sol-ring.jpg
        image_normal:
          type: string
          description: URL to normal card image
          nullable: true
          example: https://cards.scryfall.io/normal/front/1/2/sol-ring.jpg
        image_large:
          type: string
          description: URL to large card image
          nullable: true
          example: https://cards.scryfall.io/large/front/1/2/sol-ring.jpg
        prices:
          type: object
          description: Price information
          nullable: true
          example: {usd: "0.10", usd_foil: "0.50"}
        tcgProductId:
          type: integer
          description: TCGPlayer product ID
          example: 697418

    SearchResult:
      type: object
      description: |
        Container for card search results
      properties:
        total_count:
          type: integer
          description: Total number of results
          example: 1
        results:
          type: array
          items:
            $ref: '#/models/Card'
          description: Matching cards
        page:
          type: integer
          description: Current page number
          example: 1
        page_size:
          type: integer
          description: Results per page
          example: 20
        has_more:
          type: boolean
          description: Whether there are more results
          example: false

  # Error Definitions
  errors:
    AuthenticationError:
      code: 401
      message: Authentication failed
      description: |
        Invalid credentials or expired token
      httpStatus: 401
    
    NotFoundError:
      code: 404
      message: Resource not found
      description: |
        The requested resource does not exist
      httpStatus: 404
    
    ValidationError:
      code: 400
      message: Validation error
      description: |
        Invalid input parameters
      httpStatus: 400
      details:
        type: object
        properties:
          field:
            type: string
            description: Name of the invalid field
          message:
            type: string
            description: Error message
    
    RateLimitError:
      code: 429
      message: Rate limit exceeded
      description: |
        Too many requests in a short period
      httpStatus: 429
    
    APIError:
      code: 500
      message: API error
      description: |
        Unexpected API error
      httpStatus: 500

  # Implementation Requirements
  implementation:
    package: pymtg.providers.archidekt
    files:
      - path: pymtg/providers/archidekt/__init__.py
        description: Provider factory and exports
      - path: pymtg/providers/archidekt/client.py
        description: Async HTTP client with authentication and HAR logging
      - path: pymtg/providers/archidekt/models.py
        description: Pydantic data models
      - path: pymtg/providers/archidekt/provider.py
        description: Main provider interface implementing BaseProvider
      - path: pymtg/providers/archidekt/exceptions.py
        description: Custom exception classes
      - path: pymtg/providers/__init__.py
        description: Provider registry
    
    dependencies:
      - httpx>=0.25.0
      - pydantic>=2.0.0
      - typing-extensions>=4.5.0
    
    pythonVersion: ">=3.8"
    asyncRequired: true
    docstringStyle: google
