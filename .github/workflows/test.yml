name: Run Tests

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install requests pydantic typing-extensions

      - name: Install test dependencies
        run: pip install pytest pytest-cov pytest-mock types-requests

      - name: Run unit tests
        run: pytest tests/ -v --tb=short

      - name: Run unit tests (excluding integration)
        run: pytest tests/ -v --tb=short --ignore=tests/integration/
