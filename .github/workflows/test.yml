name: Run Tests

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Run Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@0903b469fbf4441aadfe4f4b249dc5b1fba3a73e
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@6a191366842ac1502ba6c07e9b5acd5d8db3

      - name: Install dependencies
        run: |
          uv lock --python ${{ matrix.python-version }}
          uv sync --all-extras

      - name: Run unit tests
        run: uv run pytest tests/ -v --tb=short

      - name: Run unit tests (excluding integration)
        run: uv run pytest tests/ -v --tb=short --ignore=tests/integration/
