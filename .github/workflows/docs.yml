name: Documentation Check

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]

jobs:
  docs:
    name: Check Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f

      - name: Set up Python
        uses: actions/setup-python@051499373543393546b33521e74747568896f4a
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@6a191366842ac1502ba6c07e9b5acd5d8db3

      - name: Check for missing docstrings
        run: |
          uv run python -c "
          import ast
          import sys

          def check_docstrings(filepath):
              with open(filepath, 'r') as f:
                  tree = ast.parse(f.read(), filepath)
              
              for node in ast.walk(tree):
                  if isinstance(node, (ast.FunctionDef, ast.ClassDef, ast.AsyncFunctionDef)):
                      if not ast.get_docstring(node):
                          if not node.name.startswith('_'):
                              print(f'{filepath}:{node.lineno}: Missing docstring for {node.name}')
                              return False
              return True

          import os
          for root, dirs, files in os.walk('pymtg'):
              dirs[:] = [d for d in dirs if d != '__pycache__']
              for file in files:
                  if file.endswith('.py'):
                      filepath = os.path.join(root, file)
                      if not check_docstrings(filepath):
                          sys.exit(1)
          print('All docstrings present!')
          "
